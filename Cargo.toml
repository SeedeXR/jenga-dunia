[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/mcp", "apps/studio", "apps/desktop/src-tauri"]
exclude = ["fuzz"] # cargo-fuzz targets (nightly): `cargo +nightly fuzz run <target>`

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/SeedeXR/jenga-dunia"
rust-version = "1.98"
publish = false

[workspace.dependencies]
jd-types = { path = "crates/jd-types" }
jd-core = { path = "crates/jd-core" }
jd-terrain = { path = "crates/jd-terrain" }
jd-graph = { path = "crates/jd-graph" }
jd-cache = { path = "crates/jd-cache" }
jd-gpu = { path = "crates/jd-gpu" }
jd-geo = { path = "crates/jd-geo" }
jd-vision = { path = "crates/jd-vision" }
jd-media = { path = "crates/jd-media" }
jd-fbxsdk = { path = "crates/jd-fbxsdk" }
jd-ipc = { path = "crates/jd-ipc" }
jd-macos = { path = "crates/jd-macos" }
jd-windows = { path = "crates/jd-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
ulid = { version = "1", features = ["serde"] }
blake3 = "1"
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
rmcp = { version = "3", features = ["server", "transport-io"] }
sysinfo = "0.39"
insta = { version = "1", features = ["json"] }
proptest = "1"
assert_cmd = "2"
tempfile = "3"
jsonschema = "0.59"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
# JdError carries message/why/next/details by design (docs/spec/error-codes.md); it is not on hot paths.
result_large_err = "allow"

# Debug builds carry line tables only: full debuginfo made `target/debug` 13 GB (wgpu, test
# binaries, clippy artefacts) and filled the disk twice a day; backtraces still show file:line.
[profile.dev]
debug = "line-tables-only"
