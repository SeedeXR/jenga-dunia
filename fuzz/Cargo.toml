[package]
name = "jd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
jd-terrain = { path = "../crates/jd-terrain" }
jd-graph = { path = "../crates/jd-graph" }

[[bin]]
name = "fbx_mesh"
path = "fuzz_targets/fbx_mesh.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scatter_csv"
path = "fuzz_targets/scatter_csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_json"
path = "fuzz_targets/graph_json.rs"
test = false
doc = false
bench = false
