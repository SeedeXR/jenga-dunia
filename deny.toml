# cargo-deny configuration — licence and advisory gate (docs/research/licensing-register.md).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained proc-macro) is pulled transitively at build time only; see cargo tree -i paste" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (unmaintained proc-macro) via glib/gtk in Tauri's Linux stack; build-time only, tracked upstream" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "bincode", version = ">=3", reason = "tombstone release; use postcard" },
  { name = "contour-isobands", reason = "AGPL" },
  { name = "openssl-sys", reason = "prefer rustls; avoid system OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
