# CI — docs validation + Rust workspace on the three target OS families.
# Runner labels verified 2026-10-19 (docs/research/stack.md §6).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  docs:
    name: docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache npx (mermaid-cli + Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-mermaid-${{ runner.os }}-${{ hashFiles('scripts/check-mermaid.mjs') }}
      - name: Validate Mermaid diagrams
        shell: bash
        run: node scripts/check-mermaid.mjs
      - name: Check internal links
        shell: bash
        run: node scripts/check-links.mjs

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri (webkit2gtk, gtk, appindicator, rsvg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release -p jd-cli -p jd-mcp
      - name: Smoke the CLI
        shell: bash
        run: |
          ./target/release/jd --json diag env | tail -1 | head -c 400; echo
          ./target/release/jd new "$RUNNER_TEMP/smoke.jdproj" --name Smoke
          ./target/release/jd --json open "$RUNNER_TEMP/smoke.jdproj" | tail -1 | grep -q '"status":"ok"'

  frontend:
    name: frontend (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck + build
        working-directory: apps/desktop
        run: pnpm build
      - name: Component tests (vitest)
        working-directory: apps/desktop
        run: pnpm test
      - name: Build jd-mcp for the UI end-to-end bridge
        run: cargo build -p jd-mcp
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: UI end-to-end (Playwright ↔ real core via jd-mcp)
        working-directory: apps/desktop
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: apps/desktop/test-results
          if-no-files-found: ignore

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
