[package]
name = "jd-studio"
description = "Jenga Dunia Studio (ADR-0017): owns the engine and serves it to the Editor over jd-ipc; its window shows the 3-D viewport and launches the Editor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jd-core.workspace = true
jd-ipc.workspace = true
jd-gpu.workspace = true
jd-terrain.workspace = true
jd-types.workspace = true
jd-macos.workspace = true
jd-windows.workspace = true
base64.workspace = true
# wgpu backends come from jd-gpu's wgpu features (metal, vulkan, dx12): one wgpu 30 for both.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "accesskit", "default_fonts", "wayland", "x11", "clipboard", "persistence"] }
bytemuck = { version = "1", features = ["derive"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# Native dialogs (the same rfd the Editor's dialog plugin uses), PNG stills, local log times.
# gtk3, as Tauri's dialog plugin: rfd refuses gtk3 and xdg-portal together, and Cargo unifies them.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "0.2"
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The macOS and Windows menu bars: the Editor's menu library (muda, already in the lock through Tauri).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.20", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe", "snapshot"] }
tempfile.workspace = true

[lints]
workspace = true

# The app bundle (ADR-0017 P5: Studio is the entry point): `scripts/package.sh` builds both release
# binaries and the Editor's helper app, then runs `cargo packager`. On macOS the Editor ships as
# the embedded helper "Jenga Dunia Editor.app" (its own bundle id, so the system's Apple Events for
# the app reach Studio; `editor::locate`). The bundle takes the Editor's Info.plist (the `.jdproj`
# package document type, its UTI and `CFBundleIconName`) merged over the generated one, and the
# Icon Composer icon (Assets.car, macOS 26+; icon.icns before). Paths are relative to this file.
# ponytail: macOS is the one packaged platform; Windows / Linux packages add `jd-app` to
# `binaries` (beside jd-studio, where `editor::locate` looks) with per-OS config when they ship.
[package.metadata.packager]
product-name = "Jenga Dunia"
identifier = "com.seedexr.jengadunia"
category = "GraphicsAndDesign"
binaries = [{ path = "jd-studio", main = true }]
icons = [
  "../desktop/src-tauri/icons/icon.icns",
  "../desktop/src-tauri/icons/32x32.png",
  "../desktop/src-tauri/icons/128x128.png",
  "../desktop/src-tauri/icons/128x128@2x.png",
  "../desktop/src-tauri/icons/icon.ico",
]
resources = [{ src = "../desktop/src-tauri/icons/Assets.car", target = "Assets.car" }]
file-associations = [{ extensions = ["jdproj"], name = "Jenga Dunia Project", description = "Jenga Dunia project directory", role = "editor" }]

[package.metadata.packager.macos]
info-plist-path = "../desktop/src-tauri/Info.plist"
# Ad hoc ("-"): sealed without an Apple Developer account (no Developer ID, no notarization). A
# "Developer ID Application: …" identity here, plus APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID in
# the environment, would sign and notarize instead.
signing-identity = "-"
embedded-apps = ["../../target/release/Jenga Dunia Editor.app"]
