[package]
name = "jd-core"
description = "Jenga Dunia core: project documents, journal/recovery, operation registry and JSON envelopes shared by GUI, CLI and MCP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jd-types.workspace = true
jd-terrain.workspace = true
jd-geo.workspace = true
jd-vision = { workspace = true, optional = true }
jd-graph.workspace = true
jd-cache.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff = { version = "0.2", features = ["serde"] }
sysinfo.workspace = true

[dev-dependencies]
insta.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true
jsonschema.workspace = true

[lints]
workspace = true

[features]
# `vision`: the photograph-to-relief op; off → no ONNX Runtime download at build time.
vision = ["dep:jd-vision"]
default = ["vision"]
