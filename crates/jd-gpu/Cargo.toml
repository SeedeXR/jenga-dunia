[package]
name = "jd-gpu"
description = "Jenga Dunia headless GPU compute: terrain kernels in WGSL on a wgpu device, parity-tested against the CPU kernels in jd-terrain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jd-types.workspace = true
jd-terrain.workspace = true
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[lints]
workspace = true
