[package]
name = "jd-media"
description = "Jenga Dunia media metadata: what a photo, a 360° panorama or a video says about where, when and how it was taken (EXIF, XMP GPano, ISO BMFF / QuickTime boxes), and the sun's position at that place and time."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jd-types.workspace = true
serde.workspace = true
schemars.workspace = true
# EXIF from JPEG, TIFF, HEIF, PNG and WebP (BSD-2-Clause, pure Rust, one tiny dependency).
kamadak-exif = "0.6.1"
# Decoded dimensions of JPEG and PNG (already in the tree through jd-vision and jd-geo).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
