[package]
name = "jd-vision"
description = "Jenga Dunia vision: monocular depth from a photograph (MoGe-2 through ONNX Runtime) as a height field."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jd-types.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# ort fetches a prebuilt ONNX Runtime at build time (its default `download-binaries`). The
# `coreml` feature was tried and left out: once compiled in, ONNX Runtime 1.31 hands this model
# to CoreML whatever the session asks for, and CoreML fails to compute it.
# rustls for the download: the default native-tls would pull system OpenSSL on Linux, which
# deny.toml bans.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }

[lints]
workspace = true
