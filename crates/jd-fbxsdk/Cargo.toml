[package]
name = "jd-fbxsdk"
description = "Jenga Dunia FBX SDK adapter: reads and writes meshes through the Autodesk FBX SDK found on the machine, as the oracle our own FBX reader and writer are checked against. Builds to a stub that reports E_DEPENDENCY_MISSING when the SDK is absent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "jdfbxsdk"

[dependencies]
jd-types.workspace = true

[build-dependencies]
cc = "1"

# This crate is the one place `unsafe` lives (the C ABI to the shim); the workspace forbids it
# everywhere else, so the lints are set here instead of inherited.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
# JdError is the workspace's error type by design (see the workspace lints).
result_large_err = "allow"
